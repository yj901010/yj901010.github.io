name: Notify IndexNow

on:
  workflow_run:
    workflows:
      - "Build and Deploy"
    types:
      - completed

permissions:
  contents: read

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Submit sitemap URLs to IndexNow
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          import xml.etree.ElementTree as ET

          SITE = "https://yj901010.github.io"
          HOST = "yj901010.github.io"
          KEY = "e80a06e5d4062145feb86d9789a8f1cb8f21046032b67872ed271b95cd349987"
          KEY_LOCATION = f"{SITE}/{KEY}.txt"
          SITEMAP = f"{SITE}/sitemap.xml"

          # Give GitHub Pages a moment to make the just-deployed files globally visible.
          time.sleep(5)

          with urllib.request.urlopen(SITEMAP, timeout=30) as response:
              root = ET.fromstring(response.read())

          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [
              loc.text.strip()
              for loc in root.findall(".//sm:loc", ns)
              if loc.text and loc.text.strip().startswith(SITE)
          ]

          # IndexNow accepts up to 10,000 URLs in one POST.
          urls = list(dict.fromkeys(urls))[:10000]

          payload = json.dumps({
              "host": HOST,
              "key": KEY,
              "keyLocation": KEY_LOCATION,
              "urlList": urls
          }).encode("utf-8")

          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  code = response.getcode()
                  print(f"IndexNow response: {code}; submitted URLs: {len(urls)}")
                  if code not in (200, 202):
                      raise SystemExit(f"Unexpected IndexNow response: {code}")
          except urllib.error.HTTPError as exc:
              print("IndexNow error:", exc.code, exc.read().decode("utf-8", "ignore"))
              raise
          PY
