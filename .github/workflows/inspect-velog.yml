name: Migrate Velog

on:
  push:
    paths:
      - ".github/workflows/inspect-velog.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install converter
        run: pip install markdownify beautifulsoup4 requests

      - name: Convert Velog RSS to Jekyll posts
        run: |
          cat > /tmp/migrate_velog.py <<'PY'
          import re, os, pathlib, urllib.request
          import xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime
          from zoneinfo import ZoneInfo
          import requests
          from bs4 import BeautifulSoup
          from markdownify import markdownify as md

          feed = "https://v2.velog.io/rss/@joker901010"
          data = urllib.request.urlopen(feed, timeout=30).read()
          root = ET.fromstring(data)

          meta = {
              "800GB 테이블 조회 12초에서 0.4초가 된 이유?": ("800gb-index-performance", ["Database", "Performance"], ["index", "sql", "performance", "database"]),
              "Spring 백엔드에서 API 요청 하나는 어떻게 처리될까?": ("spring-api-request-flow", ["Backend", "Spring"], ["spring-mvc", "api", "request-flow"]),
              "회사 DB 한 테이블 전체를 Update 해버렸다?": ("database-full-update-retrospective", ["Database", "Retrospective"], ["sql", "update", "transaction", "incident"]),
              "비즈니스 로직은 Service에만 넣으면 될까?": ("business-logic-service-domain", ["Backend", "Design"], ["service", "domain", "business-logic"]),
              "의존성 방향은 왜 중요할까?": ("dependency-direction", ["Architecture", "Design"], ["dependency", "architecture", "design"]),
              "Spring Boot로 이해하는 레이어드 아키텍처": ("spring-layered-architecture", ["Architecture", "Spring"], ["spring-boot", "layered-architecture"]),
              "Spring Boot 패키지 구조, 어떻게 나눠야 할까? 레이어형과 도메인형 비교": ("spring-package-structure", ["Architecture", "Spring"], ["package", "layered", "domain"]),
              "주석보다 코드가 먼저다: 초보자를 위한 좋은 주석 작성법": ("good-comments", ["Engineering", "Code Quality"], ["comment", "clean-code"]),
              "좋은 메서드 이름은 어떻게 지을까?": ("method-naming", ["Engineering", "Code Quality"], ["naming", "method", "clean-code"]),
              "백엔드에서 공통화가 오히려 독이 되는 순간": ("backend-over-abstraction", ["Engineering", "Design"], ["abstraction", "refactoring", "design"]),
              "Spring API 응답, 꼭 공통 형식으로 감싸야 할까?": ("spring-api-response-wrapper", ["Backend", "Spring"], ["api", "response", "spring"]),
              "Spring Boot 예외 처리, 왜 한 곳에서 관리할까?": ("spring-global-exception-handler", ["Backend", "Spring"], ["exception", "controller-advice", "spring"]),
              "Spring Validation은 어디서 해야 할까?": ("spring-validation-boundaries", ["Backend", "Spring"], ["validation", "spring", "dto"]),
              "Request DTO와 Response DTO는 왜 따로 만들까?": ("request-response-dto", ["Backend", "Spring"], ["dto", "api", "spring"]),
              "엔터티를 API 응답으로 반환하면 안되는 이유": ("entity-api-response", ["Backend", "JPA"], ["entity", "dto", "jpa", "api"]),
              "DTO를 쓰는 이유": ("why-use-dto", ["Backend", "Spring"], ["dto", "spring", "api"]),
              "Controller, Service, Repository는 왜 나눌까?": ("controller-service-repository", ["Backend", "Spring"], ["controller", "service", "repository"]),
              "낯선 백엔드 프로젝트를 처음 열었을 때 무엇부터 봐야 할까?": ("reading-unfamiliar-backend-project", ["Backend", "Engineering"], ["code-reading", "spring", "project"]),
              "비밀번호를 코드에서 분리해야 하는 이유": ("separate-secrets-from-code", ["Infrastructure", "Security"], ["secret", "security", "config"]),
              "환경변수는 왜 사용하는 걸까?": ("why-environment-variables", ["Infrastructure", "Configuration"], ["environment-variable", "config", "deployment"]),
          }

          image_worthy = {
              "800GB 테이블 조회 12초에서 0.4초가 된 이유?",
              "회사 DB 한 테이블 전체를 Update 해버렸다?",
              "Spring Boot로 이해하는 레이어드 아키텍처",
              "Spring Boot 패키지 구조, 어떻게 나눠야 할까? 레이어형과 도메인형 비교",
          }

          pathlib.Path("_posts").mkdir(exist_ok=True)
          pathlib.Path("assets/images/posts").mkdir(parents=True, exist_ok=True)

          for item in root.findall("./channel/item"):
              title = item.findtext("title")
              if title not in meta:
                  continue

              link = item.findtext("link")
              pub = parsedate_to_datetime(item.findtext("pubDate")).astimezone(ZoneInfo("Asia/Seoul"))
              date = pub.strftime("%Y-%m-%d %H:%M:%S %z")
              day = pub.strftime("%Y-%m-%d")
              slug, categories, tags = meta[title]

              soup = BeautifulSoup(item.findtext("description") or "", "html.parser")
              img_index = 0

              for img in list(soup.find_all("img")):
                  src = img.get("src", "")
                  if title not in image_worthy or not src.startswith("https://velog.velcdn.com/"):
                      img.decompose()
                      continue

                  img_index += 1
                  ext = os.path.splitext(src.split("?")[0])[1].lower()
                  if ext not in {".png", ".jpg", ".jpeg", ".webp", ".gif"}:
                      ext = ".png"

                  folder = pathlib.Path("assets/images/posts") / f"{day}-{slug}"
                  folder.mkdir(parents=True, exist_ok=True)
                  local = folder / f"{img_index:02d}{ext}"

                  try:
                      response = requests.get(src, timeout=30)
                      response.raise_for_status()
                      local.write_bytes(response.content)
                      img["src"] = "/" + str(local)
                      if not img.get("alt"):
                          img["alt"] = f"{title} 설명 이미지 {img_index}"
                  except Exception:
                      img.decompose()

              body = md(str(soup), heading_style="ATX", bullets="-").strip()
              body = re.sub(r"\n{3,}", "\n\n", body)
              body = body.replace("?????????", "약 0.4초")

              categories_yaml = "[" + ", ".join(categories) + "]"
              tags_yaml = "[" + ", ".join(tags) + "]"
              safe_title = title.replace('"', '\\"')

              front = "\n".join([
                  "---",
                  f'title: "{safe_title}"',
                  f"date: {date}",
                  "last_modified_at: 2026-10-01",
                  f"categories: {categories_yaml}",
                  f"tags: {tags_yaml}",
                  f'source_url: "{link}"',
                  "---",
                  "",
              ])

              path = pathlib.Path("_posts") / f"{day}-{slug}.md"
              path.write_text(front + body + "\n", encoding="utf-8")
              print("WROTE", path)

          PY
          python /tmp/migrate_velog.py

      - name: Commit migrated posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts assets/images/posts
          git commit -m "content: migrate selected Velog posts" || exit 0
          git push
